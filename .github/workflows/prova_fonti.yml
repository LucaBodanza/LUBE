# ELSAP DSGN · News — giro di PROVA: parte quando cambiano fonti o motore (o a mano). Estrae tutto ma non salva lo stato e non tocca sito e dati.
name: Prova fonti News
on:
  push:
    branches: [main]
    paths: ["_strumenti/fonti_news.json", "_strumenti/news.py", ".github/workflows/prova_fonti.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: carica, cancel-in-progress: false }
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Giro di prova (ora + notte, senza salvare)
        run: python3 _strumenti/news.py prova
      - name: Salvo il rapporto nel repo
        run: |
          git config user.name "ELSAP DSGN"
          git config user.email "elsap-dsgn@users.noreply.github.com"
          git add _strumenti/news_prova.json
          git commit -q -m "News: rapporto giro di prova" || exit 0
          git pull -q --rebase && git push -q
