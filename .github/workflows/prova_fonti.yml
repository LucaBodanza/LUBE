# ELSAP DSGN · News — giro di PROVA, solo a mano (Actions → Prova fonti News → Run workflow).
# Estrae tutto (ora + notte) ma non salva lo stato e non tocca sito e dati: scrive solo _strumenti/news_prova.json per controllare cosa estrae.
# (Da quando c'è news.yml non parte più da solo a ogni modifica delle fonti: ci pensa il primo giro di news.yml.)
name: Prova fonti News
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: carica, cancel-in-progress: false }
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Giro di prova (ora + notte, senza salvare)
        run: python3 _strumenti/news.py prova
      - name: Salvo il rapporto nel repo
        run: |
          git config user.name "ELSAP DSGN"
          git config user.email "elsap-dsgn@users.noreply.github.com"
          git add _strumenti/news_prova.json
          git commit -q -m "News: rapporto giro di prova" || exit 0
          git pull -q --rebase && git push -q
